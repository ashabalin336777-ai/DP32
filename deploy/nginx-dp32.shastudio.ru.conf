# Host nginx vhost for the DP32 demo.
# Two projects on one VPS: this block only matches dp32.shastudio.ru
# and proxies to the compose `web` service on 127.0.0.1:8080.
#
#   sudo cp deploy/nginx-dp32.shastudio.ru.conf /etc/nginx/sites-available/dp32.shastudio.ru
#   sudo ln -s /etc/nginx/sites-available/dp32.shastudio.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS later:
#   sudo certbot --nginx -d dp32.shastudio.ru

server {
    listen 80;
    listen [::]:80;
    server_name dp32.shastudio.ru;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
