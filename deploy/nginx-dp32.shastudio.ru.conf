# HTTP-only draft. Production HTTPS vhost:
#   deploy/shastudio-nginx-dp32.conf
#   → /opt/SHASTUDIO/deploy/nginx/conf.d/dp32.shastudio.ru.conf
#
# Ports 80/443 belong to container shastudio-nginx — do not install a
# second host nginx. Attach the web container to the SHA Studio network:
#   docker network connect shastudio_default mcu-analyzer-web
#   proxy_pass http://mcu-analyzer-web:8080;
#
# Host bind is 127.0.0.1:8082 (8080 is pac-searxng). From inside nginx,
# 127.0.0.1 is the nginx container itself, not the VPS.

server {
    listen 80;
    listen [::]:80;
    server_name dp32.shastudio.ru;

    client_max_body_size 16m;

    location / {
        proxy_pass http://172.17.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
