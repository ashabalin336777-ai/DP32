# HTTP: ACME + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dp32.shastudio.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: proxy to DP32 web container on the shared Docker network
server {
    # Match other SHA Studio vhosts' listen family (IPv4+IPv6 + ssl).
    # New nginx: http2 is a separate directive, not "listen ... http2".
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dp32.shastudio.ru;

    ssl_certificate     /etc/nginx/certs/live/dp32.shastudio.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/dp32.shastudio.ru/privkey.pem;

    client_max_body_size 16m;

    location / {
        proxy_pass http://mcu-analyzer-web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
